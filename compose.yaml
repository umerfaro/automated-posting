services:
  dispatch:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/posting.sqlite3
      SAAS_ENABLED: "true"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - dispatch-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request, urllib.parse; request=urllib.request.Request('http://127.0.0.1:4000/health',headers={'Host':urllib.parse.urlsplit(os.environ.get('APP_BASE_URL','http://localhost:4000')).hostname}); urllib.request.urlopen(request)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  dispatch-data:
